spring.config.import=optional:file:./application-local.properties
spring.application.name=urlshortener

spring.datasource.url=${URL_SHORTENER_DB_URL}
spring.datasource.username=${URL_SHORTENER_DB_USERNAME}
spring.datasource.password=${URL_SHORTENER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Disable Spring Boot's default user since we use JWT login
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

jwt.secret=${URL_SHORTENER_JWT_SECRET}
jwt.expiration-ms=86400000

# In production should set these to `false`
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

app.base-url=http://localhost:8080

#logging.level.org.springframework.web=DEBUG
#logging.level.com.nalin.urlshortener=DEBUG